schema: form-flow.presentation.v1
layout:
  artwork_aspect_ratio: natural
artwork:
  background:
    enabled: true
    opacity: 0.55
    blur: 18
    overlay: 0.8
  foreground:
    position: top
    top_spacing: 32
    gap: 20
    padding: 20
    max_width: 672
appearance:
  mode: light
  light:
    canvas: '#ffffff'
    surface: '#ffffff'
    foreground: '#0f172a'
    muted: '#64748b'
    border: '#e2e8f0'
    accent: '#0f172a'
    accent_foreground: '#ffffff'
  dark:
    canvas: '#0f172a'
    surface: '#1e293b'
    foreground: '#f8fafc'
    muted: '#cbd5e1'
    border: '#475569'
    accent: '#f8fafc'
    accent_foreground: '#0f172a'
icons:
  size: 48
  review: { name: receipt, color: foreground }
  pending: { name: clock, color: '#d97706' }
  success: { name: circle-check, color: '#16a34a' }
  attention: { name: triangle-alert, color: '#d97706' }
  error: { name: circle-alert, color: '#dc2626' }
