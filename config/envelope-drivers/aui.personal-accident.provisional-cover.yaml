driver:
  id: "aui.personal-accident.provisional-cover"
  version: "1.0.0"
  title: "AUI Personal Accident Provisional Cover Demonstration"
  description: "Demonstration-only campaign settlement schema. It does not represent an accepted insurer transport contract."
  domain: "campaign-settlement"

# Discovery metadata only. The existing accepted transport disposition still governs submission.
workflow:
  service: aui-demo
  title: Purchase demonstration personal accident cover
  entry_methods: [payment_qr]
  connection: aui-demo
  requires_review: false
  plans:
    - code: PA5000_DAY
      version: '1'
      title: One-day personal accident demonstration
      currency: PHP
      premium_minor: 5000
      benefit_minor: 500000
      coverage:
        basis: day
        duration_days: 1
  notifications:
    - event: payment_recognized
      sms: 'Your demonstration payment was received. Complete your details: {claim_url}'
      placeholders: [claim_url]
      allow_override: false
    - event: demonstration_completed
      sms: 'Your demonstration summary is ready: {result_url}'
      placeholders: [result_url]
      allow_override: false

payload:
  schema:
    id: "x-change.aui-personal-accident-envelope.v1"
    format: "json_schema"
    inline:
      type: "object"
      properties:
        schema:
          type: "string"
          const: "x-change.campaign-provisional-coverage-envelope.v1"
        campaign:
          type: "object"
        payment:
          type: "object"
        coverage:
          type: "object"
        authorization:
          type: "object"
        applicant:
          type: "object"
      required: ["schema", "campaign", "payment", "coverage", "authorization"]
  storage:
    mode: "versioned"
    patch_strategy: "merge"

documents:
  registry: []

checklist:
  template: []

signals:
  definitions: []

gates:
  definitions: []

audit:
  enabled: true
  capture: ["payload_patch", "status_change"]

manifest:
  enabled: true
  includes:
    payload_hash: true
    attachments_hashes: true
    envelope_fingerprint: true
