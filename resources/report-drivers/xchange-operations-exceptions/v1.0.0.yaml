driver:
  id: xchange-operations-exceptions
  version: 1.0.0
  title: Operations Exceptions
  description: Provider-cost variances and unresolved commercial operations
  group: operations
resolver: LBHurtado\XChange\Reports\Resolvers\CommercialOperationsExceptionsReportResolver
columns:
  - { key: reference, label: Reference, type: text }
  - { key: type, label: Type, type: text }
  - { key: status, label: Status, type: text }
  - { key: variance_minor, label: Variance, type: minor_amount }
  - { key: currency, label: Currency, type: text }
  - { key: occurred_at, label: Occurred At, type: datetime }
filters:
  - { key: period, label: Period, type: period, options: [today, seven_days, thirty_days] }
