driver:
  id: xchange-operations-waterfall
  version: 1.0.0
  title: Revenue Waterfall
  description: Commercial allocation lines by destination and lifecycle state
  group: operations
resolver: LBHurtado\XChange\Reports\Resolvers\CommercialOperationsWaterfallReportResolver
columns:
  - { key: category, label: Category, type: text }
  - { key: destination, label: Destination, type: text }
  - { key: status, label: Status, type: text }
  - { key: line_count, label: Lines, type: number }
  - { key: amount_minor, label: Amount, type: minor_amount }
filters:
  - { key: period, label: Period, type: period, options: [today, seven_days, thirty_days] }
